name: Release

# Dijalankan saat tag v* di-push, misal: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries (cross-compile)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/zackly20/commit-ai/cmd.version=${VERSION}"

          build() {
            local os=$1 arch=$2 ext=${3:-}
            local out="dist/commit-ai-${os}-${arch}${ext}"
            echo "== building ${out}"
            GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags "${LDFLAGS}" -o "${out}" .
          }

          # Windows (amd64 + arm64)
          build windows amd64 .exe
          build windows arm64 .exe
          # macOS (Intel + Apple Silicon)
          build darwin amd64
          build darwin arm64
          # Linux (amd64 + arm64)
          build linux amd64
          build linux arm64

          # Arsip per-platform: .zip untuk Windows, .tar.gz lainnya
          cd dist
          for f in commit-ai-windows-*; do
            zip -q "${f%.exe}.zip" "$f"
          done
          for f in commit-ai-darwin-* commit-ai-linux-*; do
            tar czf "${f}.tar.gz" "$f"
          done
          rm -f commit-ai-*

          # Checksums untuk verifikasi unduhan
          sha256sum * > checksums.txt
          cd ..

      - name: Test (sebelum rilis)
        run: go test ./...

      - name: Upload ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
