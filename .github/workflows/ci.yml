name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o commit-ai-test .

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write # untuk push branch coverage-badge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # riwayat penuh dibutuhkan untuk push branch badge

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test with coverage
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        id: cov
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%",""); print $3}')
          echo "percent=$pct" >> "$GITHUB_OUTPUT"
          color=$(awk -v p="$pct" 'BEGIN{print (p>=80?"brightgreen":p>=60?"green":p>=40?"yellow":"red")}')
          echo "color=$color" >> "$GITHUB_OUTPUT"
          echo "Total coverage: ${pct}%"
          go tool cover -func=coverage.out | tail -5

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      # Publish badge ke branch coverage-badge (bukan default branch, agar
      # tidak muncul di contributors). Badge dibaca shields.io endpoint.
      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          PCT: ${{ steps.cov.outputs.percent }}
          COLOR: ${{ steps.cov.outputs.color }}
        run: |
          set -euo pipefail

          git config user.name "zackly20"
          git config user.email "136797098+zackly20@users.noreply.github.com"

          # Siapkan branch badge DULU, sebelum menulis file — checkout akan
          # menolak jika menimpa file untracked coverage.json.
          if git ls-remote --exit-code origin refs/heads/coverage-badge >/dev/null 2>&1; then
            # Refspec eksplisit agar refs/remotes/origin/coverage-badge pasti ada.
            git fetch origin +refs/heads/coverage-badge:refs/remotes/origin/coverage-badge
            git checkout -B coverage-badge origin/coverage-badge
          else
            git checkout --orphan coverage-badge
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi

          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > coverage.json

          git add coverage.json
          if git diff --cached --quiet; then
            echo "Badge tidak berubah, tidak ada commit."
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push origin coverage-badge
            echo "Badge terpublish: ${PCT}%"
          fi
